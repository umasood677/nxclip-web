# Deploy Vite + Express SPA to Cloud Run (same GCP project as backend).
name: nxclip-web GCP Continuous Deployment (CD)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GAR_REPOSITORY: nxclip-services
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${{ env.GAR_REPOSITORY }}" \
            --location="${{ env.GCP_REGION }}" --quiet || \
          gcloud artifacts repositories create "${{ env.GAR_REPOSITORY }}" \
            --repository-format=docker \
            --location="${{ env.GCP_REGION }}" \
            --description="Docker Artifact Registry for NxClip" \
            --quiet

      - name: Authorize Docker pushes
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Validate frontend env
        env:
          VITE_API_GATEWAY_URL: ${{ vars.VITE_API_GATEWAY_URL || vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "${VITE_API_GATEWAY_URL}" ]; then
            echo "::error::Set GitHub Actions variable VITE_API_GATEWAY_URL to the api-gateway origin (no trailing slash)."
            exit 1
          fi
          if [ -z "${CLOUD_RUN_SERVICE}" ]; then
            echo "CLOUD_RUN_SERVICE=nxclip-web" >> "$GITHUB_ENV"
          fi
          echo "VITE_API_GATEWAY_URL=${VITE_API_GATEWAY_URL}" >> "$GITHUB_ENV"

      - name: Build & push image
        env:
          VITE_API_GATEWAY_URL: ${{ env.VITE_API_GATEWAY_URL }}
          VITE_NOTIFICATION_WS_URL: ${{ vars.VITE_NOTIFICATION_WS_URL || vars.NEXT_PUBLIC_WS_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          SERVICE="${CLOUD_RUN_SERVICE:-nxclip-web}"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${SERVICE}"
          TAG="${IMAGE}:${GITHUB_SHA}"
          LATEST="${IMAGE}:latest"
          GATEWAY="${VITE_API_GATEWAY_URL%/}"

          docker build \
            --build-arg "VITE_API_GATEWAY_URL=${GATEWAY}" \
            --build-arg "VITE_API_GATEWAY_URL_PRODUCTION=${GATEWAY}" \
            --build-arg "VITE_NOTIFICATION_WS_URL=${VITE_NOTIFICATION_WS_URL:-}" \
            --build-arg "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}" \
            -t "${TAG}" -t "${LATEST}" \
            -f Dockerfile .

          docker push "${TAG}"
          docker push "${LATEST}"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          SERVICE="${CLOUD_RUN_SERVICE:-nxclip-web}"
          ENV_VARS="NODE_ENV=production,PORT=3000"
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            ENV_VARS="${ENV_VARS},GEMINI_API_KEY=${GEMINI_API_KEY}"
          fi

          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_TAG}" \
            --region "${{ env.GCP_REGION }}" \
            --port=3000 \
            --ingress=all \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="${ENV_VARS}"

          if ! gcloud run services add-iam-policy-binding "${SERVICE}" \
            --region="${{ env.GCP_REGION }}" \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet; then
            echo "::warning::Could not grant public invoker. Enable Allow unauthenticated in Console."
          fi

          URL=$(gcloud run services describe "${SERVICE}" \
            --region "${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "### Frontend URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set backend GitHub variable/secret FRONTEND_URL=${URL} and redeploy api-gateway for CORS." >> "$GITHUB_STEP_SUMMARY"
          echo "Add ${URL} to Google OAuth authorized JavaScript origins and GCS bucket CORS." >> "$GITHUB_STEP_SUMMARY"

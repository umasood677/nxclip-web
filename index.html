<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nxclip.app | Creator OS</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nxClip" />
    <link rel="icon" type="image/png" href="/nexa-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      Early paint must match App PageLoader. React replaces #root on mount.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(t);
          var bg = t === "light" ? "#ffffff" : "#09090b";
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
      }
      html.dark, html.dark body { background: #09090b; color: #fafafa; }
      html.light, html.light body { background: #ffffff; color: #18181b; }
      #root { min-height: 100vh; }
      .nx-page-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        user-select: none;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      html.dark .nx-page-loader { background: #09090b; color: #fafafa; }
      html.light .nx-page-loader { background: #ffffff; color: #18181b; }
      .nx-page-loader__glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(20, 184, 166, 0.12) 0%, transparent 62%);
        pointer-events: none;
      }
      .nx-page-loader__inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 1.5rem;
      }
      .nx-page-loader__mark {
        position: relative;
        margin-bottom: 1.25rem;
      }
      .nx-page-loader__pulse {
        position: absolute;
        inset: -1.25rem;
        border-radius: 999px;
        background: rgba(20, 184, 166, 0.15);
        filter: blur(24px);
        animation: nx-loader-pulse 2.4s ease-in-out infinite;
      }
      .nx-page-loader__mark img {
        position: relative;
        width: 3.5rem;
        height: 3.5rem;
        object-fit: contain;
        display: block;
      }
      .nx-page-loader__word {
        display: flex;
        align-items: flex-end;
        gap: 0.125rem;
        margin-bottom: 1.25rem;
      }
      .nx-page-loader__name {
        font-weight: 700;
        font-size: 1.125rem;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .nx-page-loader__tld {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1;
        padding-bottom: 0.125rem;
        text-transform: lowercase;
        opacity: 0.7;
      }
      .nx-page-loader__bar {
        width: 7rem;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.18);
        position: relative;
      }
      .nx-page-loader__bar-fill {
        height: 100%;
        width: 50%;
        border-radius: 999px;
        background: linear-gradient(90deg, #14b8a6, #5257f1);
        animation: nx-loader-slide 1.15s ease-in-out infinite;
      }
      @keyframes nx-loader-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(220%); }
      }
      @keyframes nx-loader-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nx-page-loader" aria-busy="true" aria-live="polite">
        <div class="nx-page-loader__glow"></div>
        <div class="nx-page-loader__inner">
          <div class="nx-page-loader__mark">
            <div class="nx-page-loader__pulse" aria-hidden="true"></div>
            <img src="/nexa-logo.png" alt="nxClip" width="56" height="56" />
          </div>
          <div class="nx-page-loader__word">
            <span class="nx-page-loader__name">nxClip</span>
            <span class="nx-page-loader__tld">.app</span>
          </div>
          <div class="nx-page-loader__bar" aria-hidden="true">
            <div class="nx-page-loader__bar-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

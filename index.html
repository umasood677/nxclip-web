<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nxclip.app | AI Creator Intelligence Platform</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/nexa-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/nexa-logo.png" />
    <!--
      Early paint = same visual as App PageLoader (inside #root).
      React replaces this node when it mounts — one continuous preloader, not two.
      Pure in-app PageLoader cannot paint until JS/CSS load; this is that same UI pre-JS.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(t);
          /* PageLoader is always zinc-950; keep early shell matching it */
          document.documentElement.style.backgroundColor = "#09090b";
          document.documentElement.style.colorScheme = "dark";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #09090b;
        color: #fafafa;
      }
      /* Mirrors App PageLoader layout so handoff is invisible */
      #root {
        min-height: 100vh;
      }
      .nx-page-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #fff;
        position: relative;
        overflow: hidden;
        user-select: none;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .nx-page-loader__glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(168, 85, 247, 0.06) 0%, transparent 65%);
        pointer-events: none;
      }
      .nx-page-loader__inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 20rem;
        padding: 0 1.5rem;
      }
      .nx-page-loader__lockup {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0.25rem;
        margin-bottom: 1.5rem;
      }
      .nx-page-loader__logo-frame {
        position: relative;
      }
      .nx-page-loader__tld {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1;
        color: rgba(161, 161, 170, 0.75);
        padding-bottom: 0.5rem;
        text-transform: lowercase;
      }
      .nx-page-loader__logo-box {
        position: relative;
        width: 6rem;
        height: 6rem;
        background: #18181b;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .nx-page-loader__logo-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .nx-page-loader__sparkle {
        position: absolute;
        top: -0.375rem;
        right: -0.375rem;
        background: #09090b;
        border: 1px solid rgba(245, 158, 11, 0.3);
        padding: 0.25rem;
        border-radius: 0.5rem;
        line-height: 0;
      }
      .nx-page-loader__title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .nx-page-loader__badge {
        display: inline-flex;
        align-items: center;
        background: rgba(168, 85, 247, 0.1);
        border: 1px solid rgba(168, 85, 247, 0.2);
        padding: 0.125rem 0.375rem;
        border-radius: 0.25rem;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #c084fc;
      }
      .nx-page-loader__log {
        margin: 0.5rem 0 0;
        height: 1rem;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.05em;
        color: #a1a1aa;
        text-transform: lowercase;
      }
      .nx-page-loader__bar {
        width: 12rem;
        height: 0.25rem;
        margin-top: 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .nx-page-loader__bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        left: -50%;
        border-radius: 999px;
        background: linear-gradient(90deg, #5257f1, #0d9488);
        animation: nx-loader-slide 1.8s ease-in-out infinite;
      }
      .nx-page-loader__footer {
        position: absolute;
        bottom: 1.5rem;
        font-size: 9px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #71717a;
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }
      @keyframes nx-loader-slide {
        0% { left: -50%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nx-page-loader" aria-busy="true" aria-live="polite">
        <div class="nx-page-loader__glow"></div>
        <div class="nx-page-loader__inner">
          <div class="nx-page-loader__lockup">
            <div class="nx-page-loader__logo-frame">
              <div class="nx-page-loader__logo-box">
                <img src="/nexa-logo.png" alt="nxClip" width="64" height="64" />
              </div>
              <div class="nx-page-loader__sparkle" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z" />
                </svg>
              </div>
            </div>
            <span class="nx-page-loader__tld">.app</span>
          </div>
          <div class="nx-page-loader__title-row">
            <span class="nx-page-loader__badge">Creator OS</span>
          </div>
          <p class="nx-page-loader__log" id="nx-boot-log">initializing creator os engine...</p>
          <div class="nx-page-loader__bar" aria-hidden="true">
            <div class="nx-page-loader__bar-fill"></div>
          </div>
        </div>
        <div class="nx-page-loader__footer">nxclip.app • platform active</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("nx-boot-log");
        if (!el) return;
        var logs = [
          "initializing creator os engine...",
          "powering viral processor core...",
          "mounting media canvas workspace...",
          "syncing creator analytics node...",
          "connecting ai coach assistant..."
        ];
        var i = 0;
        setInterval(function () {
          i = (i + 1) % logs.length;
          el.textContent = logs[i];
        }, 1200);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
